[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visionpipe"
version = "0.1.0"
description = "Practical computer-vision helpers for images, video, and datasets."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ganhao" }]
keywords = [
    "computer-vision",
    "image-processing",
    "video-processing",
    "dataset",
    "opencv",
    "pyav",
    "ffmpeg",
    "numpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "av>=19",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.8",
    "pytest>=7.2",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/cgyx008/visionpipe"
Repository = "https://github.com/cgyx008/visionpipe"
Issues = "https://github.com/cgyx008/visionpipe/issues"
Changelog = "https://github.com/cgyx008/visionpipe/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visionpipe = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["visionpipe"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["visionpipe"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
